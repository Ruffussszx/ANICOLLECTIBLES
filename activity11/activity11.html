<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Activity 11 - Array Random Name Picker</title>
        <script src="script.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Random Name Picker</h1>
        <textarea id="nameInput" placeholder="Enter names separated by commas or new lines..."></textarea>

        <div class="button-group">
            <button onclick="pickRandomName()">Pick a Random Name</button>
            <button onclick="clearNames()">Clear</button>
        </div>

        <div id="infoDisplay"></div>
        <div id="nameDisplay"></div>
    </body>
    </html>
